name: Push Workflow

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print repository info
        run: echo "Repository checked out successfully!"

      - name: List files
        run: ls -la

      - name: Print completion message
        run: echo "Workflow completed successfully!"
